<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旋刀录 · 战斗音效试听</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101318;
        --surface: #181d23;
        --surface-2: #20262d;
        --border: #39424d;
        --text: #f4f7fa;
        --muted: #9ca8b4;
        --cyan: #59d9e8;
        --pink: #ff679b;
        --gold: #f3c65b;
        --green: #68d391;
        --danger: #ff7185;
        --radius: 6px;
      }

      * { box-sizing: border-box; }

      html { background: var(--bg); }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--bg);
        color: var(--text);
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        letter-spacing: 0;
      }

      button, input { font: inherit; letter-spacing: 0; }

      button {
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--surface-2);
        color: var(--text);
        cursor: pointer;
      }

      button:hover { border-color: var(--cyan); color: var(--cyan); }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
      button:active { transform: translateY(1px); }
      button:disabled { cursor: not-allowed; opacity: 0.45; }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--border);
        background: rgba(16, 19, 24, 0.96);
        backdrop-filter: blur(10px);
      }

      .topbar-inner {
        width: min(1480px, calc(100% - 32px));
        min-height: 64px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
      .brand strong { font-family: Consolas, monospace; font-size: 17px; color: var(--cyan); white-space: nowrap; }
      .brand span { color: var(--muted); white-space: nowrap; }

      .master-controls { display: flex; align-items: center; gap: 10px; }
      .volume-control { display: flex; align-items: center; gap: 8px; color: var(--muted); }
      .volume-control input { width: 140px; accent-color: var(--cyan); }
      .volume-value { width: 40px; color: var(--text); font-family: Consolas, monospace; }
      .icon-button { width: 38px; height: 36px; font-size: 17px; }

      main { width: min(1480px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }

      .workspace-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 24px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--border);
      }

      h1 { margin: 0 0 6px; font-size: 26px; line-height: 1.2; }
      .subtitle { margin: 0; color: var(--muted); }
      .head-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
      .command { min-height: 38px; padding: 0 14px; }
      .command.primary { border-color: #31727c; background: #18353a; color: #c6f8ff; }
      .command.gold { border-color: #7e6428; background: #302817; color: #ffe59c; }

      .status-line {
        min-height: 38px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        color: var(--muted);
        font-family: Consolas, "Microsoft YaHei UI", monospace;
      }

      .status-dot { width: 8px; height: 8px; background: var(--green); box-shadow: 0 0 0 3px rgba(104, 211, 145, 0.14); }
      .status-line.error { color: var(--danger); }
      .status-line.error .status-dot { background: var(--danger); box-shadow: 0 0 0 3px rgba(255, 113, 133, 0.14); }

      .group { margin-top: 30px; }
      .group-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
      .group-head h2 { margin: 0; font-size: 17px; }
      .group-count { color: var(--muted); font-family: Consolas, monospace; }

      .event-row {
        display: grid;
        grid-template-columns: 210px minmax(0, 1fr);
        gap: 18px;
        margin-bottom: 10px;
        padding: 15px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }

      .event-meta { align-self: center; }
      .event-meta h3 { margin: 0 0 5px; font-size: 15px; }
      .event-meta p { margin: 0; color: var(--muted); font-size: 12px; }

      .choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }

      .choice {
        min-width: 0;
        padding: 0 14px;
        border-left: 1px solid var(--border);
      }

      .choice:first-child { border-left: 0; }

      .choice-head { display: flex; align-items: flex-start; gap: 9px; min-height: 43px; }
      .choice-head input { flex: 0 0 auto; margin: 3px 0 0; accent-color: var(--cyan); }
      .choice-title { min-width: 0; }
      .choice-title strong { display: block; line-height: 1.3; }
      .choice-title span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; white-space: normal; }
      .choice-code { color: var(--gold); font-family: Consolas, monospace; }

      .play-actions { display: grid; grid-template-columns: repeat(4, minmax(48px, 1fr)); gap: 5px; margin-top: 9px; }
      .play-actions button { height: 31px; padding: 0 5px; font-size: 12px; white-space: nowrap; }
      .play-actions .mix { border-color: #31727c; color: #bff8ff; }

      .source-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 9px; min-height: 21px; }
      .source-tags a {
        border: 1px solid #4a5561;
        border-radius: 3px;
        padding: 1px 5px;
        color: #b7c1ca;
        font-size: 10px;
        text-decoration: none;
      }
      .source-tags a:hover { border-color: var(--gold); color: var(--gold); }
      .source-tags a.attribution { border-color: #7e6428; color: #ffe09a; }

      .license-band { margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--border); }
      .license-band h2 { margin: 0 0 12px; font-size: 17px; }
      .source-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 18px; }
      .source-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 8px 0; border-bottom: 1px solid #272e36; }
      .source-item a { color: var(--text); text-decoration: none; }
      .source-item a:hover { color: var(--cyan); }
      .source-license { color: var(--green); font-family: Consolas, monospace; }
      .source-license.attribution { color: var(--gold); }

      .selection-output {
        width: 100%;
        min-height: 112px;
        margin-top: 14px;
        padding: 12px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #0c0f13;
        color: #dce5ec;
        font: 12px/1.5 Consolas, "Microsoft YaHei UI", monospace;
      }

      @media (max-width: 1080px) {
        .event-row { grid-template-columns: 1fr; }
        .event-meta { padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .source-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 760px) {
        .topbar-inner { width: min(100% - 20px, 1480px); min-height: 88px; align-items: flex-start; padding: 10px 0; flex-direction: column; gap: 7px; }
        .brand span { white-space: normal; }
        .master-controls { width: 100%; }
        .volume-control { flex: 1; }
        .volume-control input { min-width: 0; width: 100%; }
        main { width: min(100% - 20px, 1480px); padding-top: 20px; }
        .workspace-head { grid-template-columns: 1fr; align-items: start; }
        .head-actions { justify-content: flex-start; }
        .choices { grid-template-columns: 1fr; }
        .choice { padding: 13px 0; border-left: 0; border-top: 1px solid var(--border); }
        .choice:first-child { border-top: 0; }
        .event-row { padding: 13px; }
        .source-list { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><strong>旋刀录</strong><span>战斗音效 A/B/C 试听</span></div>
        <div class="master-controls">
          <label class="volume-control" for="masterVolume">
            <span>总音量</span>
            <input id="masterVolume" type="range" min="0" max="100" value="72" />
            <output id="volumeValue" class="volume-value">72%</output>
          </label>
          <button id="stopAll" class="icon-button" type="button" title="停止全部声音" aria-label="停止全部声音">■</button>
        </div>
      </div>
    </header>

    <main>
      <section class="workspace-head">
        <div>
          <h1>核心战斗音效候选</h1>
          <p class="subtitle">A 平衡 · B 轻快 · C 厚重</p>
        </div>
        <div class="head-actions">
          <button id="playSelected" class="command primary" type="button">▶ 试听已选全套</button>
          <button id="copySelection" class="command gold" type="button">复制选择清单</button>
          <button id="resetSelection" class="command" type="button">重置为 A</button>
        </div>
      </section>

      <div id="status" class="status-line" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">音频就绪 · 首次播放需要点击试听按钮</span>
      </div>

      <div id="auditionRoot"></div>

      <section class="license-band">
        <h2>素材来源</h2>
        <div id="sourceList" class="source-list"></div>
        <textarea id="selectionOutput" class="selection-output" readonly aria-label="当前选择清单"></textarea>
      </section>
    </main>

    <script src="./assets/audio/sfx-manifest.js"></script>
    <script>
      (() => {
        const manifest = window.SFX_AUDITION_MANIFEST;
        const root = document.getElementById("auditionRoot");
        const status = document.getElementById("status");
        const statusText = document.getElementById("statusText");
        const volumeInput = document.getElementById("masterVolume");
        const volumeValue = document.getElementById("volumeValue");
        const output = document.getElementById("selectionOutput");
        const poolSize = 4;
        const pools = new Map();
        const active = new Set();
        const timers = new Set();
        const warned = new Set();
        const selectionKey = "bladeSurvivorSfxAuditionSelectionV1";
        let masterVolume = Number(volumeInput.value) / 100;
        let selections = loadSelections();

        function setStatus(message, isError = false) {
          statusText.textContent = message;
          status.classList.toggle("error", isError);
        }

        function loadSelections() {
          try {
            return JSON.parse(localStorage.getItem(selectionKey) || "{}") || {};
          } catch {
            return {};
          }
        }

        function saveSelections() {
          localStorage.setItem(selectionKey, JSON.stringify(selections));
          updateSelectionOutput();
        }

        function allEvents() {
          return manifest.groups.flatMap((group) => group.events);
        }

        function randomFrom(items) {
          return items[Math.floor(Math.random() * items.length)];
        }

        function randomRate(range) {
          return range[0] + Math.random() * (range[1] - range[0]);
        }

        function getPool(path) {
          if (!pools.has(path)) {
            const voices = Array.from({ length: poolSize }, () => {
              const audio = new Audio(path);
              audio.preload = "auto";
              audio.addEventListener("ended", () => active.delete(audio));
              audio.addEventListener("error", () => {
                active.delete(audio);
                if (!warned.has(path)) {
                  warned.add(path);
                  console.warn(`[SFX] 无法加载音频：${path}`);
                  setStatus(`缺少音频：${path.split("/").pop()}（已跳过）`, true);
                }
              });
              return audio;
            });
            pools.set(path, { voices, cursor: 0 });
          }
          return pools.get(path);
        }

        function playVoice(layer) {
          const path = randomFrom(layer.files);
          const pool = getPool(path);
          const audio = pool.voices[pool.cursor++ % pool.voices.length];
          try {
            audio.pause();
            audio.currentTime = 0;
            audio.volume = Math.min(1, layer.volume * masterVolume);
            audio.playbackRate = randomRate(layer.rate);
            active.add(audio);
            const promise = audio.play();
            promise?.catch((error) => {
              active.delete(audio);
              if (error?.name !== "AbortError") setStatus("浏览器阻止播放，请再次点击试听按钮", true);
            });
          } catch (error) {
            active.delete(audio);
            console.warn("[SFX] 播放失败", error);
          }
        }

        function playPreset(preset, mode = "mix") {
          if (mode === "sample" || mode === "mix") preset.sample.forEach(playVoice);
          if (mode === "pixel" || mode === "mix") preset.pixel.forEach(playVoice);
          setStatus(`${preset.name} · ${mode === "sample" ? "采样层" : mode === "pixel" ? "像素层" : "混合"}`);
        }

        function playCombo(preset) {
          stopTimers();
          playPreset(preset, "mix");
          for (let index = 1; index < 6; index++) {
            const timer = setTimeout(() => {
              timers.delete(timer);
              playPreset(preset, "mix");
            }, index * 95);
            timers.add(timer);
          }
        }

        function stopTimers() {
          timers.forEach(clearTimeout);
          timers.clear();
        }

        function stopAll() {
          stopTimers();
          active.forEach((audio) => {
            audio.pause();
            audio.currentTime = 0;
          });
          active.clear();
          setStatus("已停止全部声音");
        }

        function selectChoice(eventId, choice) {
          selections[eventId] = choice;
          saveSelections();
          setStatus(`已选择 ${eventId} → ${choice}`);
        }

        function sourceTags(keys) {
          return keys.map((key) => {
            const source = manifest.sources[key];
            const className = source.license === "CC0" ? "" : "attribution";
            return `<a class="${className}" href="${source.url}" target="_blank" rel="noreferrer" title="${source.author} · ${source.license}">${source.short}</a>`;
          }).join("");
        }

        function render() {
          if (!manifest) {
            setStatus("音效清单加载失败", true);
            return;
          }
          root.innerHTML = manifest.groups.map((group) => `
            <section class="group" data-group="${group.id}">
              <div class="group-head"><h2>${group.name}</h2><span class="group-count">${group.events.length} 项</span></div>
              ${group.events.map((event) => `
                <article class="event-row" data-event="${event.id}">
                  <div class="event-meta"><h3>${event.name}</h3><p>${event.detail}</p></div>
                  <div class="choices">
                    ${["A", "B", "C"].map((code) => {
                      const choice = event.choices[code];
                      const checked = (selections[event.id] || "A") === code ? "checked" : "";
                      return `
                        <section class="choice" data-choice="${code}">
                          <label class="choice-head">
                            <input type="radio" name="choice-${event.id}" value="${code}" ${checked} />
                            <span class="choice-title"><strong><span class="choice-code">${code}</span> · ${choice.name}</strong><span>${choice.description}</span></span>
                          </label>
                          <div class="play-actions">
                            <button class="mix" type="button" data-action="mix" title="试听采样层和像素层">▶ 混合</button>
                            <button type="button" data-action="sample" title="只试听真实采样层">采样</button>
                            <button type="button" data-action="pixel" title="只试听像素瞬态层">像素</button>
                            <button type="button" data-action="combo" title="连续播放六次，检查高攻速重复感">连击</button>
                          </div>
                          <div class="source-tags">${sourceTags(choice.sources)}</div>
                        </section>`;
                    }).join("")}
                  </div>
                </article>`).join("")}
            </section>`).join("");

          root.addEventListener("change", (event) => {
            const input = event.target.closest('input[type="radio"]');
            if (!input) return;
            const eventRow = input.closest("[data-event]");
            selectChoice(eventRow.dataset.event, input.value);
          });

          root.addEventListener("click", (event) => {
            const button = event.target.closest("button[data-action]");
            if (!button) return;
            const eventRow = button.closest("[data-event]");
            const choiceElement = button.closest("[data-choice]");
            const eventDef = allEvents().find((item) => item.id === eventRow.dataset.event);
            const preset = eventDef.choices[choiceElement.dataset.choice];
            const action = button.dataset.action;
            if (action === "combo") playCombo(preset);
            else playPreset(preset, action);
          });

          renderSources();
          updateSelectionOutput();
        }

        function renderSources() {
          document.getElementById("sourceList").innerHTML = Object.values(manifest.sources).map((source) => `
            <div class="source-item">
              <a href="${source.url}" target="_blank" rel="noreferrer"><strong>${source.short}</strong><br /><span>${source.author}</span></a>
              <span class="source-license ${source.license === "CC0" ? "" : "attribution"}">${source.license}</span>
            </div>`).join("");
        }

        function selectionText() {
          const lines = ["旋刀录 · 战斗音效选择", ""];
          manifest.groups.forEach((group) => {
            lines.push(`[${group.name}]`);
            group.events.forEach((event) => {
              const code = selections[event.id] || "A";
              lines.push(`${event.id}: ${code} · ${event.choices[code].name}`);
            });
            lines.push("");
          });
          return lines.join("\n").trim();
        }

        function updateSelectionOutput() {
          output.value = selectionText();
        }

        async function copySelection() {
          const text = selectionText();
          try {
            await navigator.clipboard.writeText(text);
          } catch {
            output.focus();
            output.select();
            document.execCommand("copy");
          }
          setStatus("选择清单已复制");
        }

        function playSelected() {
          stopAll();
          allEvents().forEach((event, index) => {
            const timer = setTimeout(() => {
              timers.delete(timer);
              const code = selections[event.id] || "A";
              playPreset(event.choices[code], "mix");
            }, index * 520);
            timers.add(timer);
          });
          setStatus("正在按顺序试听已选全套");
        }

        volumeInput.addEventListener("input", () => {
          masterVolume = Number(volumeInput.value) / 100;
          volumeValue.value = `${volumeInput.value}%`;
          volumeValue.textContent = `${volumeInput.value}%`;
        });
        document.getElementById("stopAll").addEventListener("click", stopAll);
        document.getElementById("playSelected").addEventListener("click", playSelected);
        document.getElementById("copySelection").addEventListener("click", copySelection);
        document.getElementById("resetSelection").addEventListener("click", () => {
          selections = Object.fromEntries(allEvents().map((event) => [event.id, "A"]));
          saveSelections();
          root.querySelectorAll('input[value="A"]').forEach((input) => { input.checked = true; });
          setStatus("所有项目已重置为 A");
        });
        document.addEventListener("visibilitychange", () => { if (document.hidden) stopAll(); });

        render();
      })();
    </script>
  </body>
</html>
