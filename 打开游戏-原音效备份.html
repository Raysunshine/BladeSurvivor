<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <meta name="theme-color" content="#030812" />
    <title>旋刃幸存者</title>

    <style>
      :root {
        --cyan: #6ef7ff;
        --blue: #58a6ff;
        --violet: #9b7cff;
        --red: #ff5c7a;
        --gold: #ffd36a;
        --ink: #07101d;
        --panel: rgba(9, 17, 32, 0.91);
        --character-primary: #62edff;
        --character-secondary: #577cff;
        --character-glow: #2bcbea;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #030812;
        color: #eef7ff;
        font-family:
          Microsoft YaHei,
          system-ui,
          sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        touch-action: none;
      }
      .layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .hidden {
        display: none !important;
      }
      #vignette {
        background: radial-gradient(
          circle,
          transparent 45%,
          rgba(0, 0, 0, 0.52) 100%
        );
        mix-blend-mode: multiply;
      }
      #hud {
        padding: 18px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        text-shadow: 0 2px 6px #000;
      }
      .hud-left {
        width: min(470px, 58vw);
      }
      .hud-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .label {
        width: 42px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 2px;
        color: #b9d5e7;
      }
      .bar {
        height: 16px;
        flex: 1;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 9px;
        background: #03070ec2;
        overflow: hidden;
        box-shadow:
          inset 0 0 9px #000,
          0 0 12px #58a6ff1f;
      }
      .fill {
        height: 100%;
        width: 0;
        transition: width 0.15s;
      }
      .hp {
        background: linear-gradient(90deg, #dc3f63, #ff7890);
      }
      .xp {
        background: linear-gradient(
          90deg,
          var(--character-secondary),
          var(--character-primary)
        );
      }
      .value {
        min-width: 86px;
        text-align: right;
        font-size: 13px;
        font-weight: 700;
      }
      .stats {
        display: flex;
        gap: 16px;
        color: #cce5f5;
        font-size: 14px;
      }
      .stats b {
        color: #fff;
      }
      .hud-right {
        text-align: right;
      }
      .timer {
        font:
          800 31px/1 ui-monospace,
          Consolas,
          monospace;
        letter-spacing: 2px;
      }
      .boss-note {
        margin-top: 7px;
        font-size: 12px;
        color: #ffb8c5;
      }
      .hud-controls {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 7px;
        pointer-events: auto;
      }
      .volume-control {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 12px;
        padding-right: 8px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: #040b16b3;
      }
      .sound {
        pointer-events: auto;
        margin-top: 12px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: #040b16b3;
        color: #fff;
        border-radius: 8px;
        padding: 7px 11px;
        cursor: pointer;
      }
      .volume-control .sound {
        margin-top: 0;
        border-width: 0 1px 0 0;
        border-radius: 7px 0 0 7px;
      }
      .volume-control input {
        width: 92px;
        accent-color: var(--character-primary);
        cursor: pointer;
      }
      .volume-control output {
        min-width: 32px;
        color: #d7ebf5;
        font:
          700 11px ui-monospace,
          Consolas,
          monospace;
        text-align: right;
      }
      .quick-level {
        border-color: #ffd36a94;
        color: #ffe69a;
        background: #36280ac7;
      }
      .quick-level:hover {
        border-color: #ffd36a;
        background: #4e370ce6;
      }
      #perfBtn {
        margin-left: 0;
      }
      .character-hud {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 9px;
        color: var(--character-primary);
      }
      .character-hud img {
        width: 38px;
        height: 38px;
        border: 1px solid var(--character-primary);
        background: #050a14;
      }
      .character-hud span {
        display: flex;
        flex-direction: column;
      }
      .character-hud b {
        font-size: 15px;
        letter-spacing: 2px;
      }
      .character-hud small {
        margin-top: 2px;
        color: #c4d6e2;
        font-size: 10px;
      }
      .screen {
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at 50% 42%,
          #18385b99,
          #02060df0 65%
        );
      }
      .menu {
        text-align: center;
        width: min(720px, 92vw);
        padding: 36px;
      }
      .title {
        margin: 0;
        font-size: clamp(48px, 9vw, 96px);
        line-height: 1;
        letter-spacing: 9px;
        background: linear-gradient(180deg, #fff 5%, #7cf8ff 48%, #768cff);
        -webkit-background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 22px rgba(89, 213, 255, 0.42));
      }
      .subtitle {
        color: #91c8e7;
        letter-spacing: 6px;
        margin: 16px 0 40px;
      }
      .character-menu {
        width: min(1080px, 96vw);
        padding: 22px 28px;
      }
      .character-menu .title {
        font-size: clamp(44px, 7vw, 76px);
      }
      .character-menu .subtitle {
        margin: 10px 0 20px;
      }
      .character-cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin: 0 auto 20px;
      }
      .character-card {
        position: relative;
        display: grid;
        grid-template-columns: 86px 1fr;
        grid-template-rows: auto auto auto 1fr;
        column-gap: 15px;
        min-height: 202px;
        padding: 15px;
        text-align: left;
        color: #eff9ff;
        background: #070f1df0;
        border: 1px solid rgba(130, 190, 220, 0.3);
        border-radius: 8px;
        cursor: pointer;
        overflow: hidden;
        transition:
          transform 0.16s,
          border-color 0.16s,
          box-shadow 0.16s;
      }
      .character-card:hover,
      .character-card:focus-visible {
        transform: translateY(-3px);
        border-color: var(--accent);
        outline: none;
      }
      .character-card.selected {
        border-color: var(--accent);
        box-shadow:
          0 0 0 1px var(--accent),
          0 10px 30px color-mix(in srgb, var(--accent) 22%, transparent);
      }
      .character-card[data-character="xuanren"] {
        --accent: #62edff;
      }
      .character-card[data-character="yingren"] {
        --accent: #ff62b4;
      }
      .character-card[data-character="zhenyue"] {
        --accent: #8ff0a4;
      }
      .character-card img {
        grid-row: 1/5;
        width: 86px;
        height: 112px;
        object-fit: cover;
        border: 1px solid color-mix(in srgb, var(--accent) 65%, transparent);
        align-self: start;
      }
      .character-card strong {
        font-size: 23px;
        color: var(--accent);
        letter-spacing: 3px;
      }
      .character-card em {
        font-style: normal;
        font-size: 11px;
        color: #fff;
        opacity: 0.72;
        letter-spacing: 2px;
      }
      .character-card p {
        margin: 8px 0 4px;
        color: #c5d7e3;
        font-size: 11px;
        line-height: 1.5;
      }
      .character-card small {
        color: #fff;
        font-size: 11px;
        line-height: 1.45;
      }
      .character-index {
        position: absolute;
        right: 10px;
        top: 8px;
        font: 800 12px ui-monospace;
        color: var(--accent);
      }
      .primary {
        border: 1px solid #78edff;
        background: linear-gradient(135deg, #1979a2, #5046b6);
        color: #fff;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 4px;
        border-radius: 12px;
        padding: 14px 42px;
        cursor: pointer;
        box-shadow: 0 0 28px #42c6ff4d;
        transition: 0.18s;
      }
      .primary:hover {
        transform: translateY(-2px);
        filter: brightness(1.18);
      }
      .menu-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
      }
      .achievement-button {
        border: 1px solid rgba(255, 211, 106, 0.65);
        background: linear-gradient(145deg, #5b3c0ee6, #23190ef0);
        color: #ffe79a;
        font-weight: 900;
        letter-spacing: 2px;
        border-radius: 10px;
        padding: 12px 22px;
        cursor: pointer;
        box-shadow: 0 0 20px #ffc54224;
      }
      .achievement-button:hover {
        border-color: #ffe47c;
        filter: brightness(1.14);
      }
      .tips {
        margin: 32px auto 0;
        max-width: 580px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .tip {
        padding: 13px 8px;
        border: 1px solid rgba(121, 217, 255, 0.18);
        background: #0c1c3085;
        border-radius: 10px;
        font-size: 13px;
        color: #b6cfe0;
      }
      .tip b {
        display: block;
        color: #fff;
        margin-bottom: 5px;
      }
      #upgrade {
        background: #02060ed6;
        backdrop-filter: blur(5px);
        flex-direction: column;
        padding: 22px;
      }
      .up-title {
        font-size: 35px;
        font-weight: 900;
        letter-spacing: 7px;
        color: #9af8ff;
        text-shadow: 0 0 20px #168cb5;
        margin-bottom: 7px;
      }
      .up-sub {
        color: #9aafc1;
        margin-bottom: 25px;
      }
      .cards {
        display: flex;
        justify-content: center;
        gap: 18px;
        width: 100%;
        flex-wrap: wrap;
      }
      .card {
        position: relative;
        width: min(280px, 28vw);
        min-width: 220px;
        height: 330px;
        text-align: left;
        padding: 25px 20px;
        border-radius: 15px;
        border: 1px solid rgba(117, 224, 255, 0.42);
        background: linear-gradient(165deg, #1f3f5bf5, #0a1224fa 55%);
        color: #fff;
        cursor: pointer;
        overflow: hidden;
        box-shadow: 0 15px 45px #000;
        transition: 0.18s;
      }
      .card:before {
        content: "";
        position: absolute;
        inset: -60% -30%;
        background: linear-gradient(
          110deg,
          transparent 42%,
          rgba(255, 255, 255, 0.1) 50%,
          transparent 58%
        );
        transform: translate(-55%);
        transition: 0.5s;
      }
      .card:hover {
        transform: translateY(-9px) scale(1.02);
        border-color: #b3f7ff;
        box-shadow: 0 16px 45px #2b95cc52;
      }
      .card:hover:before {
        transform: translate(55%);
      }
      .card.rare {
        border-color: #ad8cff;
        background: linear-gradient(165deg, #45306df5, #0f1027fa 60%);
      }
      .card.legendary {
        border-color: #ffd56d;
        background: linear-gradient(165deg, #704615f5, #201311fa 60%);
      }
      .rarity {
        font-size: 12px;
        letter-spacing: 3px;
        color: #80eaff;
      }
      .rare .rarity {
        color: #c5a9ff;
      }
      .legendary .rarity {
        color: #ffd36a;
      }
      .icon {
        font-size: 52px;
        margin: 25px 0 15px;
        filter: drop-shadow(0 0 12px currentColor);
      }
      .card h3 {
        margin: 0 0 9px;
        font-size: 23px;
      }
      .card p {
        margin: 0;
        color: #b8c9d7;
        line-height: 1.55;
        font-size: 13px;
      }
      .level-tag {
        position: absolute;
        right: 17px;
        top: 17px;
        font-size: 12px;
        color: #b9cfdd;
      }
      .delta {
        margin-top: 12px;
        padding: 8px 9px;
        border-radius: 7px;
        background: #040c18a6;
        border: 1px solid rgba(112, 226, 255, 0.18);
        color: #8ff4ff;
        font:
          700 12px/1.45 ui-monospace,
          Microsoft YaHei,
          sans-serif;
      }
      .delta b {
        color: #fff4a9;
      }
      .reroll {
        margin-top: 23px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: #08111ecc;
        color: #cfe7f5;
        border-radius: 8px;
        padding: 9px 17px;
        cursor: pointer;
      }
      .reroll:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .card.cursed {
        border-color: #ff5476;
        background: linear-gradient(165deg, #691c31f7, #1f0a18fa 60%);
      }
      .cursed .rarity {
        color: #ff8297;
      }
      .card.evolution {
        border-color: #ffe17b;
        background: linear-gradient(145deg, #7e4f12fa, #2a1324fa 66%);
        box-shadow: 0 15px 52px #ffb73033;
      }
      .evolution .rarity {
        color: #ffe789;
      }
      #upgrade.archetype-choice {
        padding: 18px 22px;
      }
      #upgrade.archetype-choice .up-title {
        font-size: 30px;
      }
      #upgrade.archetype-choice .up-sub {
        margin-bottom: 14px;
      }
      #upgrade.archetype-choice .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        max-width: 900px;
      }
      #upgrade.archetype-choice .card {
        width: auto;
        min-width: 0;
        height: 270px;
        min-height: 270px;
        padding: 18px 16px;
      }
      #upgrade.archetype-choice .icon {
        font-size: 38px;
        margin: 16px 0 10px;
      }
      #upgrade.archetype-choice .card h3 {
        font-size: 19px;
      }
      #upgrade.archetype-choice .card p {
        min-height: 42px;
      }
      #buildPanel {
        position: fixed;
        left: 18px;
        bottom: 17px;
        max-width: min(620px, 74vw);
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        pointer-events: none;
      }
      .build-chip {
        font-size: 11px;
        padding: 5px 9px;
        border-radius: 20px;
        border: 1px solid rgba(116, 227, 255, 0.25);
        background: #040d19c7;
        color: #bdeaf7;
        box-shadow: 0 2px 9px #000;
      }
      .build-chip.element {
        border-color: #b083ff8c;
        color: #e3d4ff;
      }
      .build-chip.curse {
        border-color: #ff4c708c;
        color: #ff9daf;
      }
      .build-chip.evo {
        border-color: #ffd75ba6;
        color: #ffe38c;
        font-weight: 800;
      }
      #notice {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(24px, 5vw, 50px);
        font-weight: 900;
        letter-spacing: 8px;
        color: #fff;
        text-shadow:
          0 0 12px #ff315f,
          0 0 35px #ff315f;
        opacity: 0;
        transition: opacity 0.4s;
      }
      .result {
        text-align: center;
        width: min(520px, 90vw);
        padding: 38px;
        border: 1px solid rgba(105, 221, 255, 0.35);
        border-radius: 18px;
        background: #07101ff2;
        box-shadow: 0 20px 70px #000;
      }
      .result h2 {
        font-size: 42px;
        margin: 0 0 7px;
      }
      .result .reason {
        color: #93b7ce;
        margin-bottom: 28px;
      }
      .result-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
        margin-bottom: 28px;
      }
      .result-grid div {
        background: #26435d59;
        padding: 14px 6px;
        border-radius: 9px;
        color: #9ebdd0;
        font-size: 12px;
      }
      .result-grid b {
        display: block;
        color: #fff;
        font-size: 22px;
        margin-top: 5px;
      }
      #pause {
        background: #02060ec2;
        backdrop-filter: blur(5px);
      }
      .pause-panel {
        width: min(520px, 92vw);
        padding: 34px;
        text-align: center;
        border: 1px solid
          color-mix(in srgb, var(--character-primary) 55%, transparent);
        border-radius: 8px;
        background: #07101ff7;
        box-shadow: 0 18px 60px #000;
      }
      .pause-mark {
        display: inline-grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border: 1px solid var(--character-primary);
        color: var(--character-primary);
        font: 900 25px ui-monospace;
        box-shadow: 0 0 20px
          color-mix(in srgb, var(--character-glow) 35%, transparent);
      }
      .pause-panel h2 {
        margin: 17px 0 26px;
        font-size: 30px;
        letter-spacing: 5px;
      }
      .pause-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .pause-actions .primary,
      .pause-actions .secondary,
      .pause-actions .achievement-button {
        min-width: 138px;
        padding: 12px 18px;
        font-size: 15px;
        letter-spacing: 2px;
      }
      .secondary {
        border: 1px solid rgba(255, 105, 130, 0.55);
        background: #42101fc7;
        color: #ffbac6;
        border-radius: 8px;
        font-weight: 800;
        cursor: pointer;
      }
      .secondary:hover {
        border-color: #ff7890;
        background: #5f142ae6;
      }
      #achievements {
        z-index: 20;
        background: #02060ee0;
        backdrop-filter: blur(8px);
        padding: 20px;
      }
      .achievement-panel {
        width: min(1040px, 96vw);
        height: min(820px, 92vh);
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 213, 106, 0.4);
        border-radius: 16px;
        background: linear-gradient(150deg, #0f1c2ffa, #060b17fc);
        box-shadow: 0 25px 90px #000;
        overflow: hidden;
      }
      .achievement-panel header {
        flex: 0 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 26px 15px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .achievement-panel header small {
        color: #e6c66d;
        letter-spacing: 5px;
      }
      .achievement-panel h2 {
        margin: 3px 0 0;
        font-size: 30px;
        letter-spacing: 5px;
      }
      .achievement-panel header button {
        width: 38px;
        height: 38px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 50%;
        background: #ffffff0f;
        color: #fff;
        font-size: 25px;
        cursor: pointer;
      }
      .achievement-summary {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 14px 26px;
        color: #a9bed0;
      }
      .achievement-summary b {
        font-size: 28px;
        color: #ffe179;
      }
      .achievement-summary div {
        height: 8px;
        flex: 1;
        margin-left: 14px;
        border-radius: 8px;
        background: #00000080;
        overflow: hidden;
      }
      .achievement-summary i,
      .achievement-progress i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #d99a2b, #ffe785);
        border-radius: inherit;
      }
      .achievement-filters {
        flex: 0 0 auto;
        display: flex;
        gap: 7px;
        padding: 0 26px 14px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .achievement-filters::-webkit-scrollbar {
        display: none;
      }
      .achievement-filters button {
        flex: 0 0 auto;
        min-height: 31px;
        line-height: 1;
        border: 1px solid rgba(120, 198, 226, 0.2);
        border-radius: 18px;
        background: #06121fcc;
        color: #a9c4d6;
        padding: 7px 14px;
        cursor: pointer;
      }
      .achievement-filters button.active {
        border-color: #ffd66e;
        color: #ffe69a;
        background: #573d11b8;
      }
      .achievement-list {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: start;
        gap: 10px;
        padding: 0 18px 26px 26px;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: #9a742b rgba(2, 8, 17, 0.55);
      }
      .achievement-list::-webkit-scrollbar {
        width: 8px;
      }
      .achievement-list::-webkit-scrollbar-track {
        background: #0208118c;
        border-radius: 8px;
      }
      .achievement-list::-webkit-scrollbar-thumb {
        background: linear-gradient(#d2a33e, #74551d);
        border: 2px solid rgba(2, 8, 17, 0.7);
        border-radius: 8px;
      }
      .achievement-card {
        display: grid;
        grid-template-columns: 58px 1fr;
        gap: 13px;
        min-height: 112px;
        padding: 14px;
        border: 1px solid rgba(117, 176, 205, 0.18);
        border-radius: 10px;
        background: #050d19bd;
        opacity: 0.68;
      }
      .achievement-card.unlocked {
        border-color: #ffd36a8c;
        background: linear-gradient(135deg, #49320fa8, #0a1421e6);
        opacity: 1;
      }
      .achievement-icon {
